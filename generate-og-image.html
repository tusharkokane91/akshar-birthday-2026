<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Comic Neue', cursive;
    }
    .og-card {
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse at 15% 80%, rgba(21, 101, 192, 0.4) 0%, transparent 40%),
        radial-gradient(ellipse at 85% 20%, rgba(21, 101, 192, 0.3) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, rgba(226, 54, 54, 0.2) 0%, transparent 60%),
        linear-gradient(135deg, #0a1628 0%, #121233 40%, #0d1b3e 70%, #0a1628 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .og-border {
      position: absolute;
      inset: 12px;
      border: 3px solid rgba(226, 54, 54, 0.4);
      border-radius: 20px;
    }
    .og-content {
      text-align: center;
      z-index: 2;
      padding: 40px;
    }
    .og-photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #e23636;
      box-shadow: 0 0 30px rgba(226, 54, 54, 0.4);
      margin-bottom: 24px;
    }
    .og-pretitle {
      font-size: 20px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 6px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .og-title {
      font-family: 'Bangers', cursive;
      font-size: 72px;
      color: white;
      line-height: 1.1;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
      letter-spacing: 3px;
    }
    .og-name {
      color: #ffd54f;
    }
    .og-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #e23636;
      padding: 8px 32px;
      border-radius: 60px;
      margin: 20px 0;
      box-shadow: 0 4px 20px rgba(226, 54, 54, 0.5);
    }
    .og-badge-text {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: white;
      letter-spacing: 3px;
    }
    .og-badge-num {
      font-family: 'Bangers', cursive;
      font-size: 48px;
      color: #ffd54f;
      line-height: 1;
    }
    .og-date {
      font-size: 22px;
      color: rgba(255,255,255,0.7);
      font-weight: 700;
      letter-spacing: 2px;
    }
    .og-spider {
      position: absolute;
      bottom: 30px;
      right: 40px;
      opacity: 0.2;
    }
    .og-web-tl, .og-web-br {
      position: absolute;
      width: 200px;
      height: 200px;
      opacity: 0.1;
    }
    .og-web-tl { top: 0; left: 0; }
    .og-web-br { bottom: 0; right: 0; transform: rotate(180deg); }
  </style>
</head>
<body>
  <div class="og-card">
    <div class="og-border"></div>

    <svg class="og-web-tl" viewBox="0 0 200 200">
      <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="1"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="white" stroke-width="1"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="white" stroke-width="1"/>
      <circle cx="0" cy="0" r="160" fill="none" stroke="white" stroke-width="1"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="white" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="200" y2="200" stroke="white" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="white" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="141" y2="141" stroke="white" stroke-width="0.5"/>
    </svg>

    <svg class="og-web-br" viewBox="0 0 200 200">
      <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="1"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="white" stroke-width="1"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="white" stroke-width="1"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="white" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="200" y2="200" stroke="white" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="white" stroke-width="0.5"/>
    </svg>

    <div class="og-content">
      <img class="og-photo" src="images/akshar-kurta.jpg" alt="Akshar">
      <p class="og-pretitle">YOU'RE INVITED TO</p>
      <h1 class="og-title">
        <span class="og-name">Akshar's</span><br>
        4th Birthday!
      </h1>
      <div class="og-badge">
        <span class="og-badge-text">turning</span>
        <span class="og-badge-num">4</span>
      </div>
      <p class="og-date">Monday, March 30, 2026 &bull; 6:30 PM onwards</p>
    </div>

    <svg class="og-spider" viewBox="0 0 100 100" width="60" height="60">
      <ellipse cx="50" cy="40" rx="15" ry="12" fill="white"/>
      <ellipse cx="50" cy="58" rx="20" ry="18" fill="white"/>
      <path d="M30,40 Q15,25 5,15" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M70,40 Q85,25 95,15" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M30,50 Q10,50 0,45" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M70,50 Q90,50 100,45" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M30,58 Q10,65 0,75" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M70,58 Q90,65 100,75" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M35,70 Q20,80 10,92" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M65,70 Q80,80 90,92" stroke="white" stroke-width="2.5" fill="none"/>
    </svg>
  </div>
</body>
</html>
